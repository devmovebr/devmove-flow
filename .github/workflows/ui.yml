name: ui

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: versao
        run: echo "valor=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: framework-ui
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSAO=${{ steps.versao.outputs.valor }}
          tags: |
            ghcr.io/devmovebr/devmove-flow-ui:${{ steps.versao.outputs.valor }}
            ghcr.io/devmovebr/devmove-flow-ui:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
